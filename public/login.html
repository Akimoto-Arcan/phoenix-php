<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoenixPHP — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phoenix.css">
    <script>(function(){var t=localStorage.getItem('phoenix-theme')||'dark';if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">&#x1F525;</span>
                <h1>Phoenix<span>PHP</span></h1>
                <p>ERP &amp; CMMS Platform</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="admin" value="admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" value="demo1234">
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Sign In
                </button>
            </form>
            <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--text-muted)">
                Don't have an account? <a href="#" style="color:var(--accent)">Register</a>
            </p>
            <div style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
                <p style="font-size:12px;color:var(--text-muted)">Demo credentials pre-filled. Click Sign In.</p>
            </div>
        </div>
    </div>
    <script>
    function handleLogin(e) {
        e.preventDefault();
        var btn = document.getElementById('loginBtn');
        btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite"></span> Signing in...';
        btn.disabled = true;
        setTimeout(function() { window.location.href = 'dashboard.html'; }, 800);
    }
    </script>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
